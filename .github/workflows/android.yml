name: Build ChipBurner Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/patch-minipro.sh', 'scripts/minipro-vppcheck.c', 'Resources/logic/**', 'Sources/LogicModels.swift']
  workflow_dispatch:
    inputs:
      minipro_ref:
        description: minipro tag or branch
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build minipro and libusb for Android
        env:
          MINIPRO_REF: ${{ github.event.inputs.minipro_ref || 'main' }}
          ANDROID_API: '26'
          DIAG: ${{ github.workspace }}/android-diag.txt
        run: bash android/native/build-native.sh

      - name: Fonts (IBM Plex, OFL)
        run: |
          set -e
          mkdir -p /tmp/fonts && cd /tmp/fonts
          curl -fsSL -o plex.zip https://github.com/IBM/plex/releases/download/v6.4.0/TrueType.zip \
            && unzip -q plex.zip || { npm pack @ibm/plex@6 >/dev/null && for f in *.tgz; do mkdir -p "${f%.tgz}"; tar xzf "$f" -C "${f%.tgz}"; done; }
          { echo "### font files"; find /tmp/fonts -name 'IBMPlex*Regular*' | head -10; } >> "$GITHUB_WORKSPACE/android-diag.txt"
          D="$GITHUB_WORKSPACE/android/app/src/main/res/font"
          mkdir -p "$D"
          pick() { F="$(find /tmp/fonts -type f -name "$1" -path '*ttf*' | head -1)"; [ -n "$F" ] || F="$(find /tmp/fonts -type f -name "$1" | head -1)"; [ -n "$F" ] || { echo "missing $1"; exit 1; }; cp "$F" "$D/$2"; }
          pick IBMPlexSans-Regular.ttf plex_sans_regular.ttf
          pick IBMPlexSans-Medium.ttf plex_sans_medium.ttf
          pick IBMPlexSans-SemiBold.ttf plex_sans_semibold.ttf
          pick IBMPlexMono-Regular.ttf plex_mono_regular.ttf
          pick IBMPlexMono-SemiBold.ttf plex_mono_semibold.ttf
          ls -la "$D"

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: 0.1.${{ github.run_number }}
        run: |
          set -o pipefail
          export BUILD_DATE="$(date -u +%Y-%m-%d)"
          if ! gradle -p android assembleRelease --console=plain 2>&1 | tee gradle.log; then
            { echo "### Gradle errors"; grep -E '^e: |error:|What went wrong' -A2 gradle.log | grep -v '^> Task' | sed 's|file:///home/runner/work/chipburner/chipburner/android/app/src/main/java/com/wolfiegoesai/chipburner/||' | head -120; echo; cat android-diag.txt; } > diag2.txt
            mv diag2.txt android-diag.txt
            exit 1
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ChipBurner-0.1.${BUILD_NUMBER}.apk"
          { echo "### APK"; ls -la dist; unzip -l dist/*.apk | grep -E 'lib/|assets/minipro' ; } >> android-diag.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChipBurner-Android
          path: dist/*.apk

      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.1.${{ github.run_number }}"
          cp "dist/ChipBurner-$V.apk" dist/ChipBurner-Android.apk
          gh release create "android-v$V" dist/ChipBurner-Android.apk --repo "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title "ChipBurner for Android $V" --latest \
            --notes "Open this page on the phone and tap ChipBurner-Android.apk to download it, then open the file to install (allow installs from your browser when Android asks). Needs Android 8 or newer and a USB-OTG cable for the TL866A."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/tests/emulator-test.sh

      - name: Publish emulator screenshots
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          [ -d shots ] || exit 0
          [ -f android-emulator.txt ] && { echo "### emulator"; cat android-emulator.txt; } >> android-diag.txt
          mkdir -p /tmp/ashots && cp shots/*.png /tmp/ashots/ 2>/dev/null; cp android-emulator.txt /tmp/ashots/ 2>/dev/null
          cd /tmp/ashots
          git init -q -b android-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Android screenshots of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screenshots

      - name: Diagnostics
        if: always()
        run: |
          [ -f android-diag.txt ] || exit 0
          python3 - <<'PY'
          d = open("android-diag.txt", encoding="utf-8", errors="replace").read()
          size = 3500
          for k, c in enumerate([d[i:i + size] for i in range(0, len(d), size)][:20]):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=diag part {k}::{c}")
          PY
