name: Fetch minipro source (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone -q --depth 50 https://gitlab.com/DavidGriffith/minipro.git src
          cd src && git log -1 --format='%h %cs %s' > COMMIT.txt && rm -rf .git
          git init -q -b minipro-src && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "minipro source snapshot"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" minipro-src
