name: Build ChipBurner

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      minipro_ref:
        description: minipro tag or branch
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install autoconf automake libtool pkgconf srecord || true

      - name: Build app
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          BUILD_NUMBER: ${{ github.run_number }}
          MINIPRO_REF: ${{ github.event.inputs.minipro_ref || 'main' }}
        run: |
          APP_VERSION="${APP_VERSION#v}" bash scripts/build.sh

      - name: Diagnostics 1
        if: always()
        run: |
          [ -f diag.txt ] || exit 0
          python3 - <<'PY'
          d = open("diag.txt", encoding="utf-8", errors="replace").read()
          size = 3500
          chunks = [d[i:i + size] for i in range(0, len(d), size)][0:10]
          for k, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=diag part {k + 0}::{c}")
          PY

      - name: Diagnostics 2
        if: always()
        run: |
          [ -f diag.txt ] || exit 0
          python3 - <<'PY'
          d = open("diag.txt", encoding="utf-8", errors="replace").read()
          size = 3500
          chunks = [d[i:i + size] for i in range(0, len(d), size)][10:20]
          for k, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=diag part {k + 10}::{c}")
          PY

      - name: Diagnostics 3
        if: always()
        run: |
          [ -f diag.txt ] || exit 0
          python3 - <<'PY'
          d = open("diag.txt", encoding="utf-8", errors="replace").read()
          size = 3500
          chunks = [d[i:i + size] for i in range(0, len(d), size)][20:30]
          for k, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=diag part {k + 20}::{c}")
          PY

      - name: Diagnostics 4
        if: always()
        run: |
          [ -f diag.txt ] || exit 0
          python3 - <<'PY'
          d = open("diag.txt", encoding="utf-8", errors="replace").read()
          size = 3500
          chunks = [d[i:i + size] for i in range(0, len(d), size)][30:40]
          for k, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=diag part {k + 30}::{c}")
          PY

      - name: Publish screenshot
        if: github.ref == 'refs/heads/main' && hashFiles('dist/screenshot.png') != ''
        run: |
          mkdir -p /tmp/shot && cp dist/screenshot.png /tmp/shot/
          cd /tmp/shot
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add screenshot.png
          git commit -q -m "Screenshot of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ChipBurner
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
